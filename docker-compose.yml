services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sejours
      POSTGRES_USER: sejours
      POSTGRES_PASSWORD: sejours
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sejours -d sejours"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
